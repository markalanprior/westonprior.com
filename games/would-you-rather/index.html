        let currentIndex = -1;
        let chosen = null;
        let deck = [];
        let deckPosition = 0;
        let shownThisRound = 0;

        function shuffleDeck() {
            deck = QUESTIONS.map((_, i) => i);
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            deckPosition = 0;
            shownThisRound = 0;
        }

        function nextQuestionIndex() {
            if (deckPosition >= deck.length) shuffleDeck();
            return deck[deckPosition++];
        }

        shuffleDeck();

        function showQuestion() {
            currentIndex = nextQuestionIndex();
            shownThisRound++;
            chosen = null;

            const q = QUESTIONS[currentIndex];
            document.getElementById('question').textContent = q.question;
            document.getElementById('text-a').textContent = q.optionA;
            document.getElementById('text-b').textContent = q.optionB;
            document.getElementById('counter').textContent = 'Question ' + shownThisRound + ' of ' + QUESTIONS.length;

            document.getElementById('option-a').classList.remove('chosen');
            document.getElementById('option-b').classList.remove('chosen');
        }

        function selectOption(option) {
            chosen = option;
            document.getElementById('option-a').classList.toggle('chosen', option === 'a');
            document.getElementById('option-b').classList.toggle('chosen', option === 'b');
        }
