<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weston's Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Weston's Games</h1>
        <img src="images/weston_profilke.png" alt="Weston" class="profile-photo">
        <div class="game-tiles">
            <a href="games/space-trace/index.html" class="game-tile">
                <img src="images/space-trace-tile.jpg" alt="Space Trace" class="game-tile-image">
                <h3 class="game-tile-title">Space Trace</h3>
                <p class="game-tile-desc">Fast-paced reflex game in deep space.</p>
            </a>
            <a href="games/jumpy-dash/index.html" class="game-tile">
                <img src="images/jumpy-pro-tile-image.jpg" alt="Jumpy Dash Pro" class="game-tile-image">
                <h3 class="game-tile-title">Jumpy Dash Pro</h3>
                <p class="game-tile-desc">Platformer with hazards and goals.</p>
            </a>
            <a href="games/ninja-defense/index.html" class="game-tile">
                <img src="images/ninja-defense-tile.jpg" alt="Ninja Defense" class="game-tile-image">
                <h3 class="game-tile-title">Ninja Defense</h3>
                <p class="game-tile-desc">Defend your treehouse from flying fruit!</p>
            </a>
            <a href="games/friendrop/index.html" class="game-tile">
                <img src="images/callan.PNG" alt="Friendrop" class="game-tile-image">
                <h3 class="game-tile-title">Friendrop</h3>
                <p class="game-tile-desc">Drop and merge balls with your friends!</p>
            </a>
        </div>
    </div>
</body>
</html>
